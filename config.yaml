sources:
  # ── JobSpy (LinkedIn / Indeed / Glassdoor / Google / ZipRecruiter) ──────────
  # python-jobspy supports exactly these 5 sites — all are enabled.
  jobspy:
    enabled: true
    sites:
      - "linkedin"
      - "indeed"
      - "glassdoor"
      - "google"
      - "zip_recruiter"
    results_per_site: 50

