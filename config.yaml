        url: "https://eurotechjobs.com/jobs_rss.php"
      - name: "StartupJobs EU"
        url: "https://startupjobs.eu/feed"
      - name: "Relocate.me"
        url: "https://relocate.me/search/jobs/rss"                  # relocation-friendly
