ai:
  provider: "openai"               # openai | gemini | ollama (free/local)
  model: "gpt-4o-mini"            # cheapest option — ~$2-5/month running hourly
  min_match_score: 70

  openai_api_key: "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"
  gemini_api_key: ""              # Or set env var GEMINI_API_KEY

  cover_letter_threshold: 70      # Generate cover letter if score >= this
  company_research_threshold: 78  # Run company research if score >= this
  interview_prep_threshold: 80    # Generate interview prep if score >= this
  salary_estimate: true

  auto_apply:
    enabled: false                # Set true to enable — START WITH false!
    platforms:
      - "linkedin_easy_apply"
    max_applications_per_run: 5
    require_min_score: 85

  upskill:
    enabled: true
    run_every_n_runs: 168         # Once per week (168 hourly runs)

alerts:
  email:
    enabled: true
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    sender_email: "your@gmail.com"
    sender_password: ""            # Gmail App Password — NOT your regular password
    recipient_email: "your@email.com"
    min_score_to_alert: 70
    include_followup_reminders: true

  telegram:
    enabled: false
    bot_token: ""                  # From @BotFather. Or env var TELEGRAM_BOT_TOKEN
    chat_id: ""                    # Or env var TELEGRAM_CHAT_ID
    min_score_to_alert: 75
    send_followup_reminders: true

schedule:
  interval_minutes: 60
  run_immediately: true

database:
  path: "jobs.db"
  dedupe_window_days: 30

linkedin:
  email: ""
  password: ""

# ── New Grad / Masters Specific ──────────────────────────────────────────────
new_grad:
  enabled: true
  degree: "Masters"
  field: "Computer Science"          # Your masters field
  school: "Your University"
  school_tier: "Top-50"              # Top-10 / Top-50 / Other
  graduation_year: 2024
  is_international: false            # Set true if on F-1/OPT

visa_filter:
  exclude_no_sponsor: false          # Set TRUE if you need visa sponsorship
  require_sponsorship: false         # Only show jobs that explicitly sponsor

daily_routine:
  enabled: true
  daily_application_target: 10      # How many jobs to apply to per day
  morning_briefing_hour: 8          # Hour to send morning briefing (24h)
  evening_summary_hour: 18          # Hour to send evening summary
  streak_reminder: true             # Remind if streak is about to break

gmail_parser:
  enabled: false                    # Set true after Gmail API setup
  credentials_path: "gmail_credentials.json"
  token_path: "gmail_token.json"

portfolio:
  github_username: ""               # Your GitHub username for portfolio analysis
  linkedin_url: ""                  # Already in profile, but can override here

# ── Alerts: WhatsApp ─────────────────────────────────────────────────────────
alerts:
  whatsapp:
    enabled: false
    provider: "callmebot"             # callmebot (free) | twilio ($0.005/msg)
    # CallMeBot (free): Send "I allow callmebot to send me messages" to +34 644 50 99 43
    phone_number: "+1234567890"       # Your WhatsApp number with country code
    callmebot_api_key: ""             # You get this from CallMeBot setup
    # Twilio (paid):
    account_sid: ""
    auth_token: ""
    to_number: "+1234567890"
    min_score_to_alert: 80

# ── Scrapers: Discord Monitor ─────────────────────────────────────────────────
scrapers:
  discord:
    enabled: false
    bot_token: ""                     # Create bot at discord.com/developers/applications
    channel_ids: []                   # List of channel IDs to monitor for jobs
    # Get channel ID: Discord → Developer Mode ON → Right-click channel → "Copy ID"

# ── Study Group / Multi-User Mode ────────────────────────────────────────────
study_group:
  enabled: false
  mode: "solo"                        # solo | shared_file
  shared_file: "study_group.json"     # Share this file via Google Drive/Dropbox

# ── Integrations: Notion + Airtable ──────────────────────────────────────────
integrations:
  notion:
    enabled: false
    token: ""                         # From notion.so/my-integrations
    database_id: ""                   # From Notion database URL
    min_score_to_sync: 70

  airtable:
    enabled: false
    token: ""                         # Personal Access Token from airtable.com
    base_id: ""                       # Starts with 'app...'
    table_name: "Job Applications"
    min_score_to_sync: 70

# ── Intelligence Features ─────────────────────────────────────────────────────
intelligence:
  hiring_signals:
    enabled: true
    threshold_score: 70               # Only check signals for jobs scoring above this
  freeze_detector:
    enabled: true
    exclude_frozen: true              # Skip FROZEN companies automatically
  market_pulse:
    enabled: true
    run_every_n_runs: 168             # Weekly (168 hourly runs)

# ── Cover Letter A/B Testing ──────────────────────────────────────────────────
ab_testing:
  enabled: true
  min_samples_for_winner: 10         # Need 10 sent before declaring a winner

# ── Application Timing Optimizer ─────────────────────────────────────────────
timing:
  enabled: true
  warn_if_suboptimal: true           # Show warning if applying on Friday/weekend

# ── Reference Manager ─────────────────────────────────────────────────────────
references:
  enabled: true
  max_uses_per_month: 3             # Alert if a reference is used > 3x/month

# ── Personal Scoring Model ────────────────────────────────────────────────────
personalization:
  enabled: true
  min_interactions: 10              # Start personalizing after 10 interactions

# ── JD Summarizer ─────────────────────────────────────────────────────────────
jd_summarizer:
  enabled: true
  min_score: 60                     # Summarize JDs for jobs scoring above this

# ── Resume Optimizer ──────────────────────────────────────────────────────────
resume_optimizer:
  enabled: true
